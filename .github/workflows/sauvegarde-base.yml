name: Sauvegarde quotidienne de la base

# Ce workflow a été désactivé : le secret DATABASE_URL n'a jamais été
# configuré sur ce dépôt (il aurait fallu le créer manuellement dans
# Settings > Secrets and variables > Actions), donc il échouait à chaque
# exécution depuis sa création.
#
# La sauvegarde quotidienne tourne désormais entièrement côté Supabase
# (pg_cron + pg_net + une edge function "sauvegarde-base"), sans
# dépendre d'un secret GitHub : voir le job cron.job "gest224-sauvegarde-base"
# dans la base, et la fonction supabase/functions/sauvegarde-base. C'est un
# export JSON (pas un pg_dump binaire), déposé dans le bucket de stockage
# Supabase "backups".
#
# Le déclenchement planifié est retiré ci-dessous ; le workflow reste
# disponible en lancement manuel (Actions > ce workflow > Run workflow) si
# jamais DATABASE_URL est ajouté plus tard et qu'on veut repasser à un vrai
# pg_dump en plus.
on:
  workflow_dispatch:

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    steps:
      - name: Installer pg_dump 17 (aligné sur la version du serveur Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Générer le dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL n'est pas configuré sur ce dépôt."
            exit 1
          fi
          nom="gest224-$(date -u +%Y%m%d-%H%M%S).dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$nom"
          echo "NOM_FICHIER=$nom" >> "$GITHUB_ENV"

      - name: Publier la sauvegarde en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM_FICHIER }}
          path: ${{ env.NOM_FICHIER }}
          retention-days: 14
