name: Génération des factures récurrentes

# Génère en brouillon les factures dont un modèle récurrent (cf.
# app/(app)/factures-recurrentes) arrive à échéance, une fois par jour.
#
# Désactivé en planification : le secret de dépôt CRON_SECRET n'a jamais
# été créé, donc ce workflow échouait (401) à chaque exécution depuis sa
# création. Le déclenchement quotidien tourne désormais depuis Supabase
# (pg_cron + pg_net, job "gest224-factures-recurrentes"), qui appelle ce
# même endpoint avec le CRON_SECRET déjà configuré sur Render - sans
# dépendre d'un secret GitHub. Ce workflow reste utilisable en lancement
# manuel (il faudrait alors ajouter le secret CRON_SECRET ici aussi).
on:
  workflow_dispatch:

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la génération
        run: |
          curl -fsS --max-time 60 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://gest-224.onrender.com/api/cron/factures-recurrentes
